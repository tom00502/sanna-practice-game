<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心算練習遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>心算練習遊戲</h1>
        
        <!-- Level Selection Screen -->
        <div id="levelScreen" class="screen">
            <h2 class="screen-title">選擇關卡</h2>
            <div class="level-buttons">
                <button class="level-btn" id="additionLevel">
                    <div class="level-title">簡單加法</div>
                    <div class="level-desc">10以內的加法練習</div>
                </button>
                <button class="level-btn" id="subtractionLevel">
                    <div class="level-title">簡單減法</div>
                    <div class="level-desc">10以內的減法練習</div>
                </button>
                <button class="level-btn" id="multiplicationLevel">
                    <div class="level-title">九九乘法</div>
                    <div class="level-desc">九九乘法表練習</div>
                </button>
                <button class="level-btn" id="chainAddition3Level">
                    <div class="level-title">連加3</div>
                    <div class="level-desc">3個個位數的連續加法</div>
                </button>
                <button class="level-btn" id="chainAddition4Level">
                    <div class="level-title">連加4</div>
                    <div class="level-desc">4個個位數的加法</div>
                </button>
                <button class="level-btn" id="divisionLevel">
                    <div class="level-title">九九除法</div>
                    <div class="level-desc">九九乘法的反向練習</div>
                </button>
            </div>
        </div>
        
        <!-- Game Screen -->
        <div id="gameScreen" class="screen hidden">
            <div class="info-bar">
                <div class="question-counter">題目: <span id="questionNumber">1</span>/10</div>
                <div class="timer">時間: <span id="timer">0</span>秒</div>
            </div>
            
            <div class="card">
                <div class="question" id="question">3 + 2</div>
            </div>
            
            <div class="answers">
                <button class="answer-btn" id="answer1">5</button>
                <button class="answer-btn" id="answer2">4</button>
                <button class="answer-btn" id="answer3">6</button>
                <button class="answer-btn" id="answer4">7</button>
            </div>
        </div>
        
        <!-- Result Screen -->
        <div id="resultScreen" class="screen hidden">
            <h2>遊戲結束！</h2>
            <div class="result-card">
                <div class="score-display">
                    <div class="score-label">你的分數</div>
                    <div class="score-value" id="finalScore">100</div>
                </div>
                <div class="time-display">
                    <div class="time-label">耗費時間</div>
                    <div class="time-value" id="finalTime">30 秒</div>
                </div>
            </div>
            <button class="restart-btn" id="restartBtn">再玩一次</button>
        </div>
    </div>
    
    <!-- Perfect Score Modal -->
    <div id="perfectScoreModal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">小乖真棒！100分！</h2>
            <button class="modal-btn" id="modalConfirmBtn">確認</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
